name: Numerical reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference dependencies
        run: python -m pip install -r requirements-reproduce.txt
      - name: Run control and integrity checks
        run: python -B -m unittest discover -s tests -v
      - name: Reproduce all numerical audits
        run: python -B run_audit.py
      - name: Audit new inputs without expected results
        run: python -B audit_peaks.py --input examples/minimal/peaks.npz --config examples/minimal/config.json --output-dir results/minimal
      - name: Reproduce paired window and anatomical sensitivity
        run: python -B analyze_cub_robustness.py --input-dir data/core_audit/data --attribute-manifest data/core_audit/attribute_manifest.json --output-dir results/robustness
      - name: Reproduce released CEM audit
        run: python -B audit_released_cem.py
